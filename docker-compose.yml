# Arquitetura: Usuário → DNS → Traefik (80/443, HTTPS) → container app (8000)
#                                              └→ container uptime-kuma (3001)
# Apenas o Traefik publica portas no host. App e Kuma ficam só na rede interna.

name: projeto-cloud-devops

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false     # só expõe quem tiver label
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Redireciona todo HTTP para HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      # Certificados automáticos do Let's Encrypt (desafio HTTP-01 na porta 80)
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
      - --ping=true                                   # usado no healthcheck
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web]

  app:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    container_name: app
    restart: unless-stopped
    # Para rodar localmente sem registry: docker compose build app
    build:
      context: .
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=le
      - traefik.http.services.app.loadbalancer.server.port=8000
    networks: [web]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
      # Somente leitura: permite ao Kuma verificar se containers estão rodando
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=Host(`status.${DOMAIN}`)
      - traefik.http.routers.kuma.entrypoints=websecure
      - traefik.http.routers.kuma.tls.certresolver=le
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    networks: [web]

volumes:
  letsencrypt:
  kuma-data:

networks:
  web:
    name: web
