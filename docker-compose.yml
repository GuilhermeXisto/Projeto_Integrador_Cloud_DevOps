# Arquitetura (acesso direto pelo IP público, sem domínio, com HTTPS):
#   Usuário → https://IP_PUBLICO      → Traefik (:443)  → container app (8000)
#   Usuário → https://IP_PUBLICO:3001 → Traefik (:3001) → container uptime-kuma (3001)
#   http://IP_PUBLICO (:80) redireciona para HTTPS.
# Sem domínio o Let's Encrypt não emite certificado: o Traefik usa um certificado
# autoassinado gerado por ele mesmo (o navegador mostra um aviso na primeira vez).
# Apenas o Traefik publica portas no host. App e Kuma ficam só na rede interna.

name: projeto-cloud-devops

services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false     # só expõe quem tiver label
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443          # aplicação (HTTPS)
      - --entrypoints.kuma.address=:3001              # painel do Uptime Kuma (HTTPS)
      # Redireciona todo HTTP para HTTPS
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --log.level=INFO
      - --accesslog=true
      - --ping=true                                   # usado no healthcheck
    ports:
      - "80:80"
      - "443:443"
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [web]

  app:
    image: ${IMAGE}:${IMAGE_TAG:-latest}
    container_name: app
    restart: unless-stopped
    # Para rodar localmente sem registry: docker compose build app
    build:
      context: .
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=PathPrefix(`/`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls=true
      - traefik.http.services.app.loadbalancer.server.port=8000
    networks: [web]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - kuma-data:/app/data
      # Somente leitura: permite ao Kuma verificar se containers estão rodando
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.kuma.rule=PathPrefix(`/`)
      - traefik.http.routers.kuma.entrypoints=kuma
      - traefik.http.routers.kuma.tls=true
      - traefik.http.services.kuma.loadbalancer.server.port=3001
    networks: [web]

volumes:
  kuma-data:

networks:
  web:
    name: web
