# 1. CI: valida configuração do Docker Compose
name: 1 - CI (Testes)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Testes e Validação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Rodar testes (pytest)
        run: pytest -v

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet