# 2. Build & Push: Constrói a imagem Docker, valida localmente e envia para o GHCR
name: 2 - Build e Push

on:
  workflow_run:
    workflows: ["1 - CI (Testes)"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build da imagem
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Definir nome da imagem (minúsculo)
        id: vars
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.run_number }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ${{ steps.vars.outputs.image }}:${{ github.sha }} \
            -t ${{ steps.vars.outputs.image }}:latest .

      - name: Validar container (smoke test local)
        run: |
          docker run -d --name teste -p 8000:8000 ${{ steps.vars.outputs.image }}:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "Container não respondeu"; docker logs teste; exit 1

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da imagem
        run: |
          docker push ${{ steps.vars.outputs.image }}:${{ github.sha }}
          docker push ${{ steps.vars.outputs.image }}:latest