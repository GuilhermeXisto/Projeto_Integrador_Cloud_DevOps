# Servidor(es) de destino da automação.
# Troque o IP pelo IP público da VM e o caminho da chave pelo seu arquivo .pem.
# A chave privada NUNCA vai para o Git (*.pem está no .gitignore).

[webservers]
3.142.172.36 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/keys-lab-castelo.pem

# Para reproduzir em uma VM nova, basta adicionar/trocar a linha acima, ex.:
# 18.222.10.20 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/keys-lab-castelo.pem
