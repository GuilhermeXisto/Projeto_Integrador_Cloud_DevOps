# Automação completa: prepara um servidor Ubuntu novo e implanta o projeto da N1.
# Uso (dentro da pasta ansible/):  ansible-playbook playbook.yml
#
# Etapas:
#   1. Espera a VM ficar acessível por SSH
#   2. Prepara o servidor: pacotes, Docker + Compose, firewall, segurança
#   3. Implanta a aplicação: clona o repositório, gera o .env e sobe a stack
#   4. Verifica: containers rodando e /health respondendo via HTTPS

- name: Esperar a VM terminar de inicializar
  hosts: webservers
  gather_facts: false
  tasks:
    - name: Aguardar conexão SSH e boot completo
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

- name: Preparar o servidor Linux (Docker, firewall e segurança)
  hosts: webservers
  become: true

  tasks:
    - name: Atualizar cache do apt e instalar pacotes base
      ansible.builtin.apt:
        name: "{{ base_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Adicionar o repositório oficial do Docker (com a chave GPG)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Instalar Docker Engine e o plugin Docker Compose
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

    - name: Habilitar e iniciar o Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Permitir que o usuário de deploy use o Docker sem sudo
      ansible.builtin.user:
        name: "{{ deploy_user }}"
        groups: docker
        append: true

    - name: Firewall - liberar portas necessárias
      community.general.ufw:
        rule: allow
        port: "{{ item | string }}"
        proto: tcp
      loop: "{{ firewall_ports }}"

    - name: Firewall - bloquear o resto e ativar
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: SSH - desativar login por senha e login direto como root
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?{{ item.key }} "
        line: "{{ item.key }} {{ item.value }}"
      loop:
        - { key: PasswordAuthentication, value: "no" }
        - { key: PermitRootLogin, value: "no" }
      notify: Reiniciar SSH

    - name: Habilitar o fail2ban (proteção contra força bruta no SSH)
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

  handlers:
    - name: Reiniciar SSH
      ansible.builtin.systemd:
        name: ssh
        state: restarted

- name: Implantar a aplicação (Traefik + app + Uptime Kuma)
  hosts: webservers
  become: true

  tasks:
    - name: Criar a pasta da aplicação
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0755"

    - name: Clonar/atualizar o repositório do projeto
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ repo_branch }}"
        force: false
      become: true
      become_user: "{{ deploy_user }}"

    - name: Gerar o arquivo .env da aplicação
      ansible.builtin.template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_user }}"
        mode: "0600"

    - name: Baixar as imagens (Traefik, Uptime Kuma e app do GHCR)
      block:
        - name: Docker compose pull
          ansible.builtin.command:
            cmd: docker compose pull
            chdir: "{{ app_dir }}"
          register: compose_pull
          changed_when: "'Pulled' in compose_pull.stderr"
      rescue:
        # Se a imagem do GHCR estiver privada (ou ainda não existir),
        # constrói a imagem da aplicação no próprio servidor a partir do Dockerfile.
        - name: Imagem do GHCR indisponível - construir a imagem localmente
          ansible.builtin.command:
            cmd: docker compose build app
            chdir: "{{ app_dir }}"
          changed_when: true

        - name: Baixar as demais imagens (Traefik e Uptime Kuma)
          ansible.builtin.command:
            cmd: docker compose pull traefik uptime-kuma
            chdir: "{{ app_dir }}"
          changed_when: true

    - name: Subir a stack com Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"
      register: compose_up
      changed_when: "'Started' in compose_up.stderr or 'Recreated' in compose_up.stderr or 'Created' in compose_up.stderr"

- name: Verificar a implantação
  hosts: webservers
  become: true

  tasks:
    - name: Aguardar a aplicação responder em /health (HTTPS)
      ansible.builtin.uri:
        url: https://localhost/health
        validate_certs: false   # certificado autoassinado (acesso sem domínio)
        return_content: true
      register: health
      retries: 20
      delay: 3
      until: health.status == 200

    - name: Listar os containers em execução
      ansible.builtin.command:
        cmd: docker compose ps --format "table {{ '{{' }}.Name{{ '}}' }}\t{{ '{{' }}.Status{{ '}}' }}\t{{ '{{' }}.Ports{{ '}}' }}"
        chdir: "{{ app_dir }}"
      register: compose_ps
      changed_when: false

    - name: Resultado da implantação
      ansible.builtin.debug:
        msg:
          - "Health: {{ health.json }}"
          - "{{ compose_ps.stdout_lines }}"
          - "Aplicação:   https://{{ inventory_hostname }}  (ou http://{{ inventory_hostname }}, que redireciona)"
          - "Uptime Kuma: https://{{ inventory_hostname }}:3001"
